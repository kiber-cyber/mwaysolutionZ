  <!-- Wordmark -->
  <text x="250" y="112" font-family="Arial, sans-serif" font-size="46" font-weight="700"
        fill="#05101A" letter-spacing="1">MWAY</text>
  <text x="253" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="600"
        fill="#05101A" letter-spacing="6">SOLUTIONS</text>
  <text x="253" y="168" font-family="Arial, sans-serif" font-size="12" font-weight="400"
