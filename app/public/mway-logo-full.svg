<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 225" width="680" height="225">
  <!-- MWAY Solutions — primary logo lockup -->
  <!-- Palette: Corporate Navy #05101A, Burnished Bronze #6B563D, Paper White #F9F8F6 -->

  <!-- Mark: double-frame registration mark + angular M glyph -->
  <rect x="60" y="55" width="150" height="150" rx="8" fill="none" stroke="#05101A" stroke-width="2.5"/>
  <rect x="70" y="65" width="130" height="130" rx="6" fill="none" stroke="#05101A" stroke-width="1" opacity="0.35"/>
  <line x1="212" y1="50" x2="232" y2="50" stroke="#05101A" stroke-width="1.5" opacity="0.6"/>
  <line x1="222" y1="40" x2="222" y2="60" stroke="#05101A" stroke-width="1.5" opacity="0.6"/>
  <path d="M 95 175 L 95 90 L 135 140 L 175 90 L 175 175"
